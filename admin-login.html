<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo-optimized.png">
    <title>Admin Login - HAND OF GOD CONSTRUCTION COMPANY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <style>body { font-family: 'Montserrat', sans-serif; } h1 { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="min-h-screen bg-[#f4f6f1] flex items-center justify-center p-5">
    <main class="w-full max-w-md bg-white border border-[#e2e9e1] rounded-2xl shadow-xl p-7 sm:p-9">
        <a href="index.html" class="block text-center mb-8"><img src="images/logo-optimized.png" alt="HAND OF GOD CONSTRUCTION COMPANY" class="w-52 h-auto mx-auto"></a>
        <p class="text-xs uppercase tracking-[.18em] text-[#c29b38] font-bold">Secure workspace</p>
        <h1 class="text-3xl font-bold text-[#123f2d] mt-2">Admin sign in</h1>
        <p class="text-sm text-[#718078] mt-2">Sign in to manage property applications.</p>
        <form id="login-form" class="space-y-5 mt-8">
            <div><label for="email" class="block text-xs uppercase tracking-widest font-bold text-[#718078] mb-2">Email address</label><input id="email" name="email" type="email" autocomplete="username" required class="w-full rounded-lg border border-[#dce4dc] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c29b38]"></div>
            <div><label for="password" class="block text-xs uppercase tracking-widest font-bold text-[#718078] mb-2">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-[#dce4dc] px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c29b38]"></div>
            <button class="w-full rounded-lg bg-[#123f2d] hover:bg-[#082a1d] text-white py-3 font-bold" type="submit">Sign in</button>
            <p id="login-error" class="hidden rounded-lg bg-red-50 text-red-800 p-3 text-sm" role="alert"></p>
        </form>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', async event => {
            event.preventDefault();
            const form = event.currentTarget;
            const error = document.getElementById('login-error');
            const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: form.email.value, password: form.password.value }) });
            if (!response.ok) { error.textContent = (await response.json()).error || 'Unable to sign in.'; error.classList.remove('hidden'); return; }
            window.location.href = '/admin-dashboard.html';
        });
    </script>
</body>
</html>
